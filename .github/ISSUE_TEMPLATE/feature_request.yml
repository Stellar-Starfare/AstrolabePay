name: Feature Request
description: Suggest an idea or enhancement for AstrolabePay
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for proposing an enhancement to AstrolabePay!
  - type: dropdown
    id: component
    attributes:
      label: Target Component
      options:
        - Smart Contracts (Soroban)
        - AI Tooling & SDK
        - Reverse Proxy & Relaying
        - CLI Tool
        - Frontend & Simulator
        - Architecture & Protocol Docs
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Additional Context or Alternatives Considered
      description: Any other context or alternative solutions considered.
